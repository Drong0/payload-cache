services:
  app:
    build: .
    environment:
      CACHE_SERVICE_DATABASE_URL: postgresql+asyncpg://cache:cache@db:5432/cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache -d cache"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
